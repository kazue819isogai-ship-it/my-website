<!doctype html><html lang="ja"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>テトリス</title><link rel="stylesheet" href="tetris.css"/></head><body><main class="tetris-shell"><section class="heading"><p class="eyebrow">BLOCK DROP</p><h1>テトリス</h1><p>ブロックを積んで、ラインを消そう。</p></section><section class="game-layout"><div class="board-frame"><canvas id="game" width="300" height="600" aria-label="テトリス盤"></canvas></div><aside class="side-panel"><div class="info-card"><span>スコア</span><strong id="score">0</strong></div><div class="info-card"><span>ライン</span><strong id="lines">0</strong></div><div class="info-card"><span>レベル</span><strong id="level">1</strong></div><div class="next-card"><span>つぎのブロック</span><canvas id="next" width="120" height="100"></canvas></div><button id="start" class="primary">ゲーム開始</button><a class="back" href="index.html">← オセロに戻る</a></aside></section><div class="controls"><button data-key="ArrowLeft">←</button><button data-key="ArrowUp">↻</button><button data-key="ArrowRight">→</button><button data-key="ArrowDown">↓</button><button data-key="Space">落とす</button></div><p id="message" class="message">ゲーム開始を押してください</p><p class="help">← → 移動　↑ 回転　↓ ソフトドロップ　Space ハードドロップ</p></main><script src="tetris.js"></script></body></html>
